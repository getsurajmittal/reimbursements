<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Reimbursements</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Login screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-6">
      <h1 class="text-xl font-semibold text-center mb-1">Reimbursements</h1>
      <p class="text-sm text-slate-500 text-center mb-6">Sign in to continue</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
        <button type="submit"
          class="w-full bg-indigo-600 text-white rounded-lg py-2.5 font-medium active:bg-indigo-700">
          Log in
        </button>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="hidden max-w-lg mx-auto min-h-screen flex flex-col pb-20">
    <header class="bg-indigo-600 text-white px-4 py-4 flex items-center justify-between sticky top-0 z-10 shadow">
      <div>
        <p class="text-xs text-indigo-200 leading-none">Signed in as</p>
        <p class="font-semibold leading-tight" id="user-name">-</p>
      </div>
      <button id="logout-btn" class="text-sm bg-indigo-500/60 px-3 py-1.5 rounded-lg active:bg-indigo-500">
        Log out
      </button>
    </header>

    <main id="main-content" class="flex-1 p-4 space-y-4"></main>

    <nav id="tab-bar" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 flex">
      <!-- tab buttons injected by JS depending on role -->
    </nav>
  </div>

  <!-- Image lightbox -->
  <div id="lightbox" class="hidden fixed inset-0 bg-black/80 z-50 items-center justify-center p-4" onclick="this.classList.add('hidden')">
    <img id="lightbox-img" src="" class="max-h-full max-w-full rounded-lg" />
  </div>

  <script src="./js/supabaseClient.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
